<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>United Services CRM</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
<style>
  :root{
    --navy:#26276D; --navy-d:#1c1d52; --cyan:#27AAE1; --cyan-d:#0e87bd;
    --bg:#eef1f8; --panel:#ffffff; --soft:#f4f6fb; --line:#e3e8f2;
    --txt:#1f2440; --mut:#6b7385; --hint:#9aa0b0;
    --green:#15803d; --amber:#b45309; --red:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  .app{display:flex;flex-direction:column;height:100vh}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;background:var(--navy);border-bottom:3px solid var(--cyan);padding:0 16px;height:52px;flex:0 0 auto}
  .brand{font-weight:500;font-size:15px;letter-spacing:2px;color:var(--cyan)}
  .brand span{color:#fff}
  .topsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:7px;padding:6px 11px;width:300px;max-width:38vw}
  .topsearch input{background:none;border:none;outline:none;color:#fff;font-size:13px;width:100%}
  .topsearch input::placeholder{color:#b9c0e6}
  .avatar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--cyan);color:#0b3a4a;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px}
  /* layout */
  .body{display:flex;flex:1;min-height:0}
  .queue{width:360px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .qhead{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line)}
  .qhead h2{margin:0;font-size:14px;font-weight:500;color:var(--navy)}
  .qhead .cnt{color:var(--mut);font-weight:400}
  .btn{cursor:pointer;border:none;border-radius:7px;font-weight:500;font-size:12px;padding:6px 11px}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-d)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--cyan);color:var(--cyan-d)}
  .qfilters{display:flex;gap:6px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--line)}
  .qfilters select{font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--txt);outline:none}
  .qfilters select:focus{border-color:var(--cyan)}
  .qlist{overflow-y:auto;flex:1}
  .crow{display:flex;flex-direction:column;gap:4px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .crow:hover{background:var(--soft)}
  .crow.active{background:#eaf6fc;border-left:3px solid var(--cyan);padding-left:10px}
  .crow .nm{font-size:13px;font-weight:500;color:var(--navy)}
  .crow .sub{font-size:11px;color:var(--mut)}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
  .p-tier{background:#e7e7f3;color:var(--navy)}
  .p-rel{background:#e2f4fc;color:var(--cyan-d)}
  .p-stage{background:#eef0f6;color:#4a5169}
  .fit-Strategic{background:#dde9ff;color:#1d4ed8}
  .fit-High{background:#dcfce7;color:#15803d}
  .fit-Medium{background:#fef3c7;color:#b45309}
  /* detail */
  .detail{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
  .empty{color:var(--mut);text-align:center;margin-top:20vh}
  .dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 22px}
  .dhead .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .dhead h1{margin:0;font-size:20px;font-weight:500;color:var(--navy)}
  .dhead .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
  .loc{font-size:12px;color:var(--mut)}
  .tabs{display:flex;gap:20px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{font-size:13px;padding:11px 0;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
  .tab.active{color:var(--navy);border-bottom-color:var(--cyan)}
  .tab .c{color:var(--hint);font-weight:400}
  .tabwrap{padding:18px 22px;max-width:900px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 20px}
  .f label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin-bottom:3px}
  .f .v{font-size:13px;word-break:break-word}
  .f .v a{color:var(--cyan-d);text-decoration:none}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tr:last-child td{border-bottom:none}
  .status{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%}
  .s-signed{color:var(--green)} .s-signed .dot{background:var(--green)}
  .s-pending,.s-draft{color:var(--amber)} .s-pending .dot,.s-draft .dot{background:var(--amber)}
  .s-none,.s-expired{color:var(--red)} .s-none .dot,.s-expired .dot{background:var(--red)}
  .avatarsm{width:30px;height:30px;border-radius:50%;background:#e7e7f3;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:0 0 auto}
  .add-link{color:var(--cyan-d);cursor:pointer;font-weight:500;font-size:13px}
  .icon-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:12px;padding:2px 6px}
  .icon-btn:hover{color:var(--cyan-d)}
  .row-actions{text-align:right;white-space:nowrap}
  .note{color:var(--mut);font-size:12px;white-space:pre-wrap}
  .banner{background:#eaf6fc;border:1px solid #bfe4f5;color:#0e6b95;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
  /* modal */
  .mbg{position:fixed;inset:0;background:rgba(31,36,64,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .mbg.open{display:flex}
  .modal{background:var(--panel);border-radius:12px;width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:20px}
  .modal h3{margin:0 0 14px;color:var(--navy)}
  .modal .f{margin-bottom:11px}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;background:var(--soft);border:1px solid var(--line);color:var(--txt);border-radius:7px;font-size:13px;font-family:inherit}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--cyan)}
  .modal textarea{min-height:64px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .cf-row{display:flex;gap:8px;margin-top:10px}
  .cf-row input{flex:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">UNITED <span>SERVICES</span></div>
    <div class="topsearch"><span style="color:#b9c0e6">&#9906;</span><input id="search" placeholder="Search companies, contacts..." oninput="render()"/></div>
    <div class="avatar">GT</div>
  </div>
  <div class="body">
    <aside class="queue">
      <div class="qhead">
        <h2>Companies <span class="cnt" id="cnt"></span></h2>
        <button class="btn primary" onclick="openCompany()">+ New</button>
      </div>
      <div class="qfilters">
        <select id="fRel" onchange="render()"></select>
        <select id="fTier" onchange="render()"></select>
        <select id="fFit" onchange="render()"></select>
        <select id="fStage" onchange="render()"></select>
      </div>
      <div class="qlist" id="qlist"></div>
    </aside>
    <main class="detail" id="detail"><div class="empty">Select a company from the list.</div></main>
  </div>
</div>
<div class="mbg" id="m1"><div class="modal" id="m1in"></div></div>
<div class="mbg" id="m2"><div class="modal" id="m2in"></div></div>
<script>
const REL=["Developer","EPC","Developer / EPC","Electrical Contractor","Owner / IPP","Investor","Vendor / Supplier","Subcontractor","Government / Permitting","Community / NGO","Other"];
const STAGES=["Prospecting","Qualifying","Active","Contract","Dormant","Closed"];
const TIERS=["Tier A","Tier B","Tier C","Prospect",""];
const FITS=["Strategic","High","Medium",""];
const DOCT=["NDA","MSA","Subcontract","Service Agreement","Insurance / COI","W-9 / Tax","Permit","Other"];
const DOCS=["Signed","Pending","Draft","Expired","None"];
const TZONES=["Eastern","Central","Mountain","Pacific","Alaska","Hawaii-Aleutian",""];
const KEY="us_crm_console_v1";
const MSAL_CFG={auth:{clientId:"08b5f379-bc54-423b-b9fd-72242cfe908b",authority:"https://login.microsoftonline.com/720752f2-761f-405d-866a-efdb633125d9",redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:"localStorage"}};
const SCOPES=["Sites.ReadWrite.All"];
const pca=new msal.PublicClientApplication(MSAL_CFG);
let IN_TEAMS=false;
const teamsReady=(async()=>{try{await Promise.race([microsoftTeams.app.initialize(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("no-teams")),1500))]);return true;}catch(e){return false;}})();
function teamsLogin(){return microsoftTeams.authentication.authenticate({url:window.location.origin+window.location.pathname+"auth-start.html",width:600,height:535});}
let SITE=null;
let DOCLIB=null;
let DB={companies:[]};
let TEAMS_TOKEN=null,TEAMS_EXP=0;async function tok(){if(IN_TEAMS){if(TEAMS_TOKEN&&Date.now()<TEAMS_EXP)return TEAMS_TOKEN;const t=await teamsLogin();if(!t)throw new Error("Sign-in did not complete");TEAMS_TOKEN=t;TEAMS_EXP=Date.now()+55*60*1000;return t;}let a=pca.getAllAccounts()[0];if(!a){await pca.loginRedirect({scopes:SCOPES});return new Promise(function(){});}try{return (await pca.acquireTokenSilent({account:a,scopes:SCOPES})).accessToken;}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES});return new Promise(function(){});}}
async function graph(path,opts){opts=opts||{};const t=await tok();const r=await fetch("https://graph.microsoft.com/v1.0"+path,Object.assign({},opts,{headers:Object.assign({Authorization:"Bearer "+t,"Content-Type":"application/json"},opts.headers||{})}));if(r.status===204)return {};const j=await r.json();if(j.error)throw new Error(j.error.message||"Graph error");return j;}
function deep(o){return JSON.parse(JSON.stringify(o))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function id(){return Math.random().toString(36).slice(2,10)}
let sel=null,tab="overview";
function esc(s){return(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function sc(s){return"s-"+(s||"none").toLowerCase().replace(/[^a-z]/g,"")}
function lk(u){if(!u)return"&#8212;";const h=u.startsWith("http")?u:"https://"+u;return '<a href="'+esc(h)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'}
function opt(arr,all){return '<option value="">'+all+'</option>'+arr.filter(x=>x).map(x=>'<option>'+x+'</option>').join("")}
function initF(){
  fRel.innerHTML=opt(REL,"All types");fTier.innerHTML=opt(TIERS,"All tiers");
  fFit.innerHTML=opt(FITS,"All fit");fStage.innerHTML=opt(STAGES,"All stages");
}
function render(){
  const q=(search.value||"").toLowerCase();
  const r=fRel.value,t=fTier.value,f=fFit.value,s=fStage.value;
  const m=DB.companies.filter(c=>{
    const hay=(c.name+" "+c.industry+" "+c.location+" "+(c.contacts||[]).map(x=>x.name+x.role).join(" ")).toLowerCase();
    return(!q||hay.includes(q))&&(!r||c.rel===r)&&(!t||c.tier===t)&&(!f||c.fit===f)&&(!s||c.stage===s);
  });
  cnt.textContent=m.length+" of "+DB.companies.length;
  qlist.innerHTML=m.length?m.map(c=>`
    <div class="crow ${c.id===sel?'active':''}" onclick="pick('${c.id}')">
      <div class="nm">${esc(c.name)}</div>
      <div class="sub">${esc(c.rel)}${c.location?' &middot; '+esc(c.location):''}</div>
      <div class="pills">${c.tier?`<span class="pill p-tier">${esc(c.tier)}</span>`:""}${c.fit?`<span class="pill fit-${esc(c.fit)}">${esc(c.fit)}</span>`:""}</div>
    </div>`).join(""):`<div class="note" style="padding:16px">No matches.</div>`;
}
function pick(cid){sel=cid;tab="overview";render();detailView()}
function company(){return DB.companies.find(x=>x.id===sel)}
function detailView(){
  const c=company();
  if(!c){detail.innerHTML=`<div class="empty">Select a company from the list.</div>`;return}
  const tabs=[["overview","Overview",null],["contacts","Contacts",(c.contacts||[]).length],["documents","Documents",(c.docs||[]).length],["events","Events",(c.events||[]).length],["more","More",(c.custom||[]).length]];
  detail.innerHTML=`
    <div class="dhead"><div class="row1">
      <div>
        <h1>${esc(c.name)}</h1>
        <div class="meta">
          <span class="pill p-rel">${esc(c.rel)}</span>
          ${c.tier?`<span class="pill p-tier">${esc(c.tier)}</span>`:""}
          ${c.fit?`<span class="pill fit-${esc(c.fit)}">${esc(c.fit)} fit</span>`:""}
          <span class="pill p-stage">${esc(c.stage)}</span>
          ${c.location?`<span class="loc">&#128205; ${esc(c.location)}</span>`:""}
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="openCompany('${c.id}')">Edit</button>
        <button class="btn ghost" onclick="delCompany('${c.id}')">Delete</button>
      </div>
    </div></div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${t[0]===tab?'active':''}" onclick="setTab('${t[0]}')">${t[1]}${t[2]!=null?` <span class="c">${t[2]}</span>`:''}</div>`).join("")}</div>
    <div class="tabwrap" id="tw"></div>`;
  tabView(c);
}
function setTab(t){tab=t;detailView()}
function tabView(c){
  const w=document.getElementById("tw");
  if(tab==="overview"){
    w.innerHTML=`
      <div class="card"><h3>Snapshot</h3><div class="grid">
        <div class="f"><label>Relationship</label><div class="v">${esc(c.rel)}</div></div>
        <div class="f"><label>Stage</label><div class="v">${esc(c.stage)}</div></div>
        <div class="f"><label>Tier</label><div class="v">${esc(c.tier)||"&#8212;"}</div></div>
        <div class="f"><label>United Services fit</label><div class="v">${esc(c.fit)||"&#8212;"}</div></div>
        <div class="f"><label>Company type</label><div class="v">${esc(c.industry)||"&#8212;"}</div></div>
        <div class="f"><label>Location</label><div class="v">${esc(c.location)||"&#8212;"}</div></div>
        <div class="f"><label>Website</label><div class="v">${lk(c.website)}</div></div>
        <div class="f"><label>LinkedIn</label><div class="v">${lk(c.linkedin)}</div></div>
        <div class="f"><label>Owner</label><div class="v">${esc(c.owner)||"&#8212;"}</div></div>
      </div></div>
      <div class="card"><h3>Notes</h3><div class="note">${esc(c.notes)||"No notes yet."}</div></div>
      <div class="card"><h3>Key documents</h3>${docSum(c)}</div>`;
  }
  if(tab==="contacts"){
    w.innerHTML=`<div class="card"><h3>People we talk to</h3>
      <table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Phone</th><th>Time Zone</th><th>Last</th><th></th></tr></thead><tbody>${
      (c.contacts||[]).map(p=>`<tr>
        <td><div style="display:flex;align-items:center;gap:9px"><span class="avatarsm">${esc((p.name||"?").split(" ").map(x=>x[0]).slice(0,2).join(""))}</span><strong>${esc(p.name)}</strong></div>${p.notes?`<div class="note" style="margin-left:39px">${esc(p.notes)}</div>`:""}</td>
        <td>${esc(p.role)}</td><td>${esc(p.email)}</td><td>${esc(p.phone)}</td><td>${esc(p.timezone)||"&#8212;"}</td><td>${esc(p.last)||"&#8212;"}</td>
        <td class="row-actions"><button class="icon-btn" onclick="openSub('contact','${p.id}')">edit</button><button class="icon-btn" onclick="delSub('contacts','${p.id}')">&times;</button></td>
      </tr>`).join("")||`<tr><td colspan="7" class="note">No contacts yet.</td></tr>`}</tbody></table>
      <div style="margin-top:12px"><span class="add-link" onclick="openSub('contact')">+ Add contact</span></div></div>`;
  }
  if(tab==="documents"){
    w.innerHTML=`<div class="card"><h3>Legal &amp; key documents</h3>
      <div class="banner">Files you add here upload straight into your SharePoint CRM Documents library.</div>
      <table><thead><tr><th>Document</th><th>Status</th><th>Date</th><th>File</th><th></th></tr></thead><tbody>${
      (c.docs||[]).map(d=>`<tr><td><strong>${esc(d.type)}</strong></td>
        <td><span class="status ${sc(d.status)}"><span class="dot"></span>${esc(d.status)}</span></td>
        <td>${esc(d.date)||"&#8212;"}</td><td>${d.link?esc(d.link):"&#8212;"}</td>
        <td class="row-actions"><button class="icon-btn" onclick="openSub('doc','${d.id}')">edit</button><button class="icon-btn" onclick="delSub('docs','${d.id}')">&times;</button></td></tr>`).join("")||`<tr><td colspan="5" class="note">No documents yet.</td></tr>`}</tbody></table>
      <div style="margin-top:12px"><span class="add-link" onclick="openSub('doc')">+ Add document</span></div></div>`;
  }
  if(tab==="events"){
    w.innerHTML=`<div class="card"><h3>Events &amp; networking</h3>
      <table><thead><tr><th>Event</th><th>Date</th><th>Location</th><th>Who's attending</th><th></th></tr></thead><tbody>${
      (c.events||[]).map(e=>`<tr><td><strong>${esc(e.name)}</strong>${e.notes?`<div class="note">${esc(e.notes)}</div>`:""}</td>
        <td>${esc(e.date)||"&#8212;"}</td><td>${esc(e.location)||"&#8212;"}</td><td>${esc(e.who)||"&#8212;"}</td>
        <td class="row-actions"><button class="icon-btn" onclick="openSub('event','${e.id}')">edit</button><button class="icon-btn" onclick="delSub('events','${e.id}')">&times;</button></td></tr>`).join("")||`<tr><td colspan="5" class="note">No events tracked yet.</td></tr>`}</tbody></table>
      <div style="margin-top:12px"><span class="add-link" onclick="openSub('event')">+ Add event</span></div></div>`;
  }
  if(tab==="more"){
    w.innerHTML=`<div class="card"><h3>Custom fields</h3>
      <div>${(c.custom||[]).map((f,i)=>`<div class="grid" style="margin-bottom:8px"><div class="f"><label>${esc(f.k)}</label><div class="v">${esc(f.v)}</div></div><div style="display:flex;align-items:flex-end"><button class="icon-btn" onclick="delCustom(${i})">remove</button></div><div></div></div>`).join("")||`<div class="note">No custom fields yet.</div>`}</div>
      <div class="cf-row"><input id="ck" placeholder="Field name"/><input id="cv" placeholder="Value"/><button class="btn primary" onclick="addCustom()">Add</button></div></div>`;
  }
}
function docSum(c){const want=["NDA","MSA","Insurance / COI"];
  return `<table><thead><tr><th>Document</th><th>Status</th></tr></thead><tbody>${want.map(t=>{const d=(c.docs||[]).find(x=>x.type===t);const s=d?d.status:"None";return `<tr><td>${t}</td><td><span class="status ${sc(s)}"><span class="dot"></span>${s}</span></td></tr>`}).join("")}</tbody></table>`}
function addCustom(){const c=company();const k=ck.value.trim(),v=cv.value.trim();if(!k)return;c.custom=c.custom||[];c.custom.push({k,v});save();detailView()}
function delCustom(i){const c=company();c.custom.splice(i,1);save();detailView()}
function selo(arr,v){return arr.map(o=>`<option ${o===v?"selected":""}>${o||"&#8212;"}</option>`).join("")}
function openCompany(cid){
  const c=cid?company():{name:"",rel:"Other",stage:"Prospecting",tier:"",fit:"",industry:"",website:"",linkedin:"",location:"",owner:"Geronimo LeBaron",notes:""};
  m1in.innerHTML=`<h3>${cid?"Edit company":"New company"}</h3>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Company name *</label><input id="x_name" value="${esc(c.name)}"/></div>
    <div class="g2">
      <div class="f"><label style="font-size:11px;color:var(--mut)">Relationship</label><select id="x_rel">${selo(REL,c.rel)}</select></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Stage</label><select id="x_stage">${selo(STAGES,c.stage)}</select></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Tier</label><select id="x_tier">${selo(TIERS,c.tier)}</select></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Fit</label><select id="x_fit">${selo(FITS,c.fit)}</select></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Company type</label><input id="x_industry" value="${esc(c.industry)}"/></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Location</label><input id="x_location" value="${esc(c.location)}"/></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Website</label><input id="x_website" value="${esc(c.website)}"/></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">LinkedIn</label><input id="x_linkedin" value="${esc(c.linkedin)}"/></div>
      <div class="f"><label style="font-size:11px;color:var(--mut)">Owner</label><input id="x_owner" value="${esc(c.owner)}"/></div>
    </div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Notes</label><textarea id="x_notes">${esc(c.notes)}</textarea></div>
    <div class="mfoot"><button class="btn ghost" onclick="close1()">Cancel</button><button class="btn primary" onclick="saveCompany('${cid||''}')">Save</button></div>`;
  m1.classList.add("open");
}
function fix(v){return v==="—"?"":v}
async function saveCompany(cid){const g=i=>document.getElementById(i).value;const name=g("x_name").trim();if(!name){alert("Name required");return}
  const d={name,rel:g("x_rel"),stage:g("x_stage"),tier:fix(g("x_tier")),fit:fix(g("x_fit")),industry:g("x_industry"),website:g("x_website"),linkedin:g("x_linkedin"),location:g("x_location"),owner:g("x_owner")||"",notes:g("x_notes")};
  const fields={Title:d.name,RelationshipType:d.rel,Stage:d.stage,Tier:d.tier,Fit:d.fit,CompanyType:d.industry,Website:d.website,LinkedIn:d.linkedin,Location:d.location,Owner:d.owner,Notes:d.notes};
  close1();
  try{if(cid){const c=company();Object.assign(c,d);await graph("/sites/"+SITE+"/lists/Companies/items/"+c.spId+"/fields",{method:"PATCH",body:JSON.stringify(fields)});}
    else{const r=await graph("/sites/"+SITE+"/lists/Companies/items",{method:"POST",body:JSON.stringify({fields})});const n=Object.assign({id:r.id,spId:r.id,custom:[],contacts:[],docs:[],events:[]},d);DB.companies.unshift(n);sel=n.id;}
  }catch(e){alert("Save failed: "+(e.message||e));}
  render();detailView()}
async function delCompany(cid){if(!confirm("Delete this company?"))return;const c=DB.companies.find(x=>x.id===cid);try{await graph("/sites/"+SITE+"/lists/Companies/items/"+c.spId,{method:"DELETE"});}catch(e){alert("Delete failed: "+(e.message||e));return;}DB.companies=DB.companies.filter(x=>x.id!==cid);if(sel===cid)sel=null;render();detailView()}
function openSub(kind,sid){const c=company();let rec,title,fields;
  if(kind==="contact"){rec=sid?c.contacts.find(x=>x.id===sid):{name:"",role:"",email:"",phone:"",linkedin:"",last:"",notes:"",timezone:""};title=sid?"Edit contact":"Add contact";
    fields=`<div class="f"><label style="font-size:11px;color:var(--mut)">Name *</label><input id="y_name" value="${esc(rec.name)}"/></div>
    <div class="g2"><div class="f"><label style="font-size:11px;color:var(--mut)">Role</label><input id="y_role" value="${esc(rec.role)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Last contact</label><input id="y_last" type="date" value="${esc(rec.last)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Email</label><input id="y_email" value="${esc(rec.email)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Phone</label><input id="y_phone" value="${esc(rec.phone)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Time zone</label><select id="y_timezone">${selo(TZONES,rec.timezone||"")}</select></div></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">LinkedIn</label><input id="y_linkedin" value="${esc(rec.linkedin||'')}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Notes</label><textarea id="y_notes">${esc(rec.notes)}</textarea></div>`}
  if(kind==="doc"){rec=sid?c.docs.find(x=>x.id===sid):{type:DOCT[0],status:DOCS[1],date:"",link:""};title=sid?"Edit document":"Add document";
    fields=`<div class="g2"><div class="f"><label style="font-size:11px;color:var(--mut)">Type</label><select id="y_type">${selo(DOCT,rec.type)}</select></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Status</label><select id="y_status">${selo(DOCS,rec.status)}</select></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Date</label><input id="y_date" type="date" value="${esc(rec.date)}"/></div></div>
    ${sid?`<div class="f"><label style="font-size:11px;color:var(--mut)">File</label><div class="v">${rec.link?`<a href="${esc(rec.link)}" target="_blank" rel="noopener">Open current file</a>`:"(no file)"}</div></div>`:`<div class="f"><label style="font-size:11px;color:var(--mut)">Upload file *</label><input type="file" id="y_file"/></div>`}`}
  if(kind==="event"){rec=sid?c.events.find(x=>x.id===sid):{name:"",date:"",location:"",who:"",notes:""};title=sid?"Edit event":"Add event";
    fields=`<div class="f"><label style="font-size:11px;color:var(--mut)">Event name *</label><input id="y_name" value="${esc(rec.name)}"/></div>
    <div class="g2"><div class="f"><label style="font-size:11px;color:var(--mut)">Date</label><input id="y_date" type="date" value="${esc(rec.date)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Location</label><input id="y_location" value="${esc(rec.location)}"/></div></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Who's attending</label><input id="y_who" value="${esc(rec.who)}"/></div>
    <div class="f"><label style="font-size:11px;color:var(--mut)">Notes</label><textarea id="y_notes">${esc(rec.notes)}</textarea></div>`}
  m2in.innerHTML=`<h3>${title}</h3>${fields}<div class="mfoot"><button class="btn ghost" onclick="close2()">Cancel</button><button class="btn primary" onclick="saveSub('${kind}','${sid||''}')">Save</button></div>`;
  m2.classList.add("open");
}
async function saveSub(kind,sid){const c=company();const g=i=>{const e=document.getElementById(i);return e?e.value:""};
  if(kind==="contact"){const rec={name:g("y_name").trim(),role:g("y_role"),email:g("y_email"),phone:g("y_phone"),linkedin:g("y_linkedin"),last:g("y_last"),notes:g("y_notes"),timezone:g("y_timezone")};if(!rec.name){alert("Name required");return}
    const fields={Title:rec.name,Company:c.name,Role:rec.role,Email:rec.email,Phone:rec.phone,LinkedIn:rec.linkedin,Notes:rec.notes,TimeZone:rec.timezone};if(rec.last)fields.LastContact=rec.last+"T00:00:00Z";
    close2();
    try{if(sid){const ex=c.contacts.find(x=>x.id===sid);Object.assign(ex,rec);await graph("/sites/"+SITE+"/lists/Contacts/items/"+ex.spId+"/fields",{method:"PATCH",body:JSON.stringify(fields)});}
      else{const r=await graph("/sites/"+SITE+"/lists/Contacts/items",{method:"POST",body:JSON.stringify({fields})});rec.id=r.id;rec.spId=r.id;c.contacts.push(rec);}}catch(e){alert("Save failed: "+(e.message||e));}
    detailView();return;}
  if(kind==="doc"){
    if(sid){const ex=c.docs.find(x=>x.id===sid);ex.type=g("y_type");ex.status=g("y_status");ex.date=g("y_date");close2();try{await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+ex.spId+"/fields",{method:"PATCH",body:JSON.stringify(Object.assign({DocType:ex.type,Status:ex.status,Company:c.name},ex.date?{DocDate:ex.date+"T00:00:00Z"}:{}))});}catch(e){alert("Save failed: "+(e.message||e));}detailView();return;}
    const fe=document.getElementById("y_file");const file=fe&&fe.files[0];if(!file){alert("Choose a file to upload");return;}
    if(!DOCLIB){alert("Documents library not found");return;}
    close2();
    try{const t=await tok();const safe=(c.name+"_"+g("y_type")+"_"+Date.now()+"_"+file.name).replace(/[^A-Za-z0-9._-]/g,"_");
      const up=await fetch("https://graph.microsoft.com/v1.0/sites/"+SITE+"/lists/"+DOCLIB+"/drive/root:/"+encodeURIComponent(safe)+":/content",{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":file.type||"application/octet-stream"},body:file});
      const drv=await up.json();if(drv.error)throw new Error(drv.error.message);
      const li=await graph("/sites/"+SITE+"/drives/"+drv.parentReference.driveId+"/items/"+drv.id+"/listItem?$select=id");
      await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+li.id+"/fields",{method:"PATCH",body:JSON.stringify(Object.assign({DocType:g("y_type"),Status:g("y_status"),Company:c.name},g("y_date")?{DocDate:g("y_date")+"T00:00:00Z"}:{}))});
      c.docs=c.docs||[];c.docs.push({spId:li.id,id:li.id,type:g("y_type"),status:g("y_status"),date:g("y_date"),link:drv.webUrl});
    }catch(e){alert("Upload failed: "+(e.message||e));}
    detailView();return;}
  let arr,rec;
  if(kind==="event"){arr="events";rec={name:g("y_name").trim(),date:g("y_date"),location:g("y_location"),who:g("y_who"),notes:g("y_notes")};if(!rec.name){alert("Event name required");return}}
  c[arr]=c[arr]||[];if(sid){Object.assign(c[arr].find(x=>x.id===sid),rec)}else{rec.id=id();c[arr].push(rec)}
  close2();detailView()}
async function delSub(arr,sid){if(!confirm("Remove this record?"))return;const c=company();if(arr==="contacts"){const ex=c.contacts.find(x=>x.id===sid);try{await graph("/sites/"+SITE+"/lists/Contacts/items/"+ex.spId,{method:"DELETE"});}catch(e){alert("Delete failed: "+(e.message||e));return;}}if(arr==="docs"){const ex=c.docs.find(x=>x.id===sid);try{await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+ex.spId,{method:"DELETE"});}catch(e){alert("Delete failed: "+(e.message||e));return;}}c[arr]=c[arr].filter(x=>x.id!==sid);detailView()}
function close1(){m1.classList.remove("open")}
function close2(){m2.classList.remove("open")}
function mapC(it){const f=it.fields||{};return{spId:it.id,id:it.id,name:f.Title||"",rel:f.RelationshipType||"Other",stage:f.Stage||"Prospecting",tier:f.Tier||"",fit:f.Fit||"",industry:f.CompanyType||"",website:f.Website||"",linkedin:f.LinkedIn||"",location:f.Location||"",owner:f.Owner||"",notes:f.Notes||"",custom:[{k:"US Registration",v:f.USRegistration||""},{k:"Phone",v:f.Phone||""},{k:"General email",v:f.GeneralEmail||""}].filter(x=>x.v),contacts:[],docs:[],events:[]};}
function mapK(it){const f=it.fields||{};return{spId:it.id,id:it.id,name:f.Title||"",role:f.Role||"",email:f.Email||"",phone:f.Phone||"",linkedin:f.LinkedIn||"",last:(f.LastContact||"").slice(0,10),notes:f.Notes||"",timezone:f.TimeZone||"",_company:f.Company||""};}
function mapD(it){const f=it.fields||{};return{spId:it.id,id:it.id,type:f.DocType||"Other",status:f.Status||"None",date:(f.DocDate||"").slice(0,10),link:(it.driveItem&&it.driveItem.webUrl)||"",_company:f.Company||""};}
async function pageAll(url){let out=[];while(url){const j=await graph(url);out=out.concat(j.value||[]);url=j["@odata.nextLink"]?j["@odata.nextLink"].replace("https://graph.microsoft.com/v1.0",""):null;}return out;}
async function boot(){
  try{
    IN_TEAMS=await teamsReady;
    document.getElementById("detail").innerHTML='<div class="empty">Signing in and loading your SharePoint data...</div>';
    const s=await graph("/sites/unitedservicesenergy.sharepoint.com:/sites/UnitedServicesTeamHub");
    SITE=s.id;
    const comp=await pageAll("/sites/"+SITE+"/lists/Companies/items?$expand=fields&$top=200");
    const cont=await pageAll("/sites/"+SITE+"/lists/Contacts/items?$expand=fields&$top=200");
    DB.companies=comp.map(mapC).sort((a,b)=>a.name.localeCompare(b.name));
    cont.map(mapK).forEach(p=>{const o=DB.companies.find(c=>c.name===p._company);if(o)o.contacts.push(p);});
    try{const lists=await graph("/sites/"+SITE+"/lists?$select=id,displayName,name&$top=100");const dl=(lists.value||[]).find(l=>l.displayName==="CRM Documents"||l.name==="CRM Documents");DOCLIB=dl?dl.id:null;if(DOCLIB){const docs=await pageAll("/sites/"+SITE+"/lists/"+DOCLIB+"/items?$expand=fields,driveItem&$top=200");docs.map(mapD).forEach(d=>{const o=DB.companies.find(c=>c.name===d._company);if(o)o.docs.push(d);});}}catch(e){}
    render();detailView();if(DB.companies.length)pick(DB.companies[0].id);
  }catch(e){document.getElementById("detail").innerHTML='<div class="empty">Could not load data.<br>'+(e.message||e)+'</div>';}
}
initF(); (async function(){try{await pca.handleRedirectPromise();}catch(e){}boot();})();

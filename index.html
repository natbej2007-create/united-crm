<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>United Services CRM</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
<style>
  :root{
    --navy:#26276D; --navy-d:#1c1d52; --cyan:#27AAE1; --cyan-d:#0e87bd;
    --bg:#eef1f8; --panel:#ffffff; --soft:#f4f6fb; --line:#e3e8f2;
    --txt:#1f2440; --mut:#6b7385; --hint:#9aa0b0;
    --green:#15803d; --amber:#b45309; --red:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  .app{display:flex;flex-direction:column;height:100vh}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;background:var(--navy);border-bottom:3px solid var(--cyan);padding:0 16px;height:52px;flex:0 0 auto}
  .brand{font-weight:500;font-size:15px;letter-spacing:2px;color:var(--cyan)}
  .brand span{color:#fff}
  .topsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:7px;padding:6px 11px;width:300px;max-width:38vw}
  .topsearch input{background:none;border:none;outline:none;color:#fff;font-size:13px;width:100%}
  .topsearch input::placeholder{color:#b9c0e6}
  .avatar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--cyan);color:#0b3a4a;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px}
  /* layout */
  .body{display:flex;flex:1;min-height:0}
  .queue{width:360px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .qhead{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line)}
  .qhead h2{margin:0;font-size:14px;font-weight:500;color:var(--navy)}
  .qhead .cnt{color:var(--mut);font-weight:400}
  .btn{cursor:pointer;border:none;border-radius:7px;font-weight:500;font-size:12px;padding:6px 11px}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-d)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--cyan);color:var(--cyan-d)}
  .qfilters{display:flex;gap:6px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--line)}
  .qfilters select{font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--txt);outline:none}
  .qfilters select:focus{border-color:var(--cyan)}
  .qlist{overflow-y:auto;flex:1}
  .crow{display:flex;flex-direction:column;gap:4px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .crow:hover{background:var(--soft)}
  .crow.active{background:#eaf6fc;border-left:3px solid var(--cyan);padding-left:10px}
  .crow .nm{font-size:13px;font-weight:500;color:var(--navy)}
  .crow .sub{font-size:11px;color:var(--mut)}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
  .p-tier{background:#e7e7f3;color:var(--navy)}
  .p-rel{background:#e2f4fc;color:var(--cyan-d)}
  .p-stage{background:#eef0f6;color:#4a5169}
  .p-dept-bd{background:#e2f4fc;color:var(--cyan-d)}
  .p-dept-legal{background:#efe7f3;color:#6b3fa0}
  .fit-Strategic{background:#dde9ff;color:#1d4ed8}
  .fit-High{background:#dcfce7;color:#15803d}
  .fit-Medium{background:#fef3c7;color:#b45309}
  /* detail */
  .detail{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
  .empty{color:var(--mut);text-align:center;margin-top:20vh}
  .dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 22px}
  .dhead .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .dhead h1{margin:0;font-size:20px;font-weight:500;color:var(--navy)}
  .dhead .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
  .loc{font-size:12px;color:var(--mut)}
  .tabs{display:flex;gap:20px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{font-size:13px;padding:11px 0;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
  .tab.active{color:var(--navy);border-bottom-color:var(--cyan)}
  .tab .c{color:var(--hint);font-weight:400}
  .tabwrap{padding:18px 22px;max-width:900px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 20px}
  .f label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin-bottom:3px}
  .f .v{font-size:13px;word-break:break-word}
  .f .v a{color:var(--cyan-d);text-decoration:none}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tr:last-child td{border-bottom:none}
  .status{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%}
  .s-signed{color:var(--green)} .s-signed .dot{background:var(--green)}
  .s-pending,.s-draft{color:var(--amber)} .s-pending .dot,.s-draft .dot{background:var(--amber)}
  .s-none,.s-expired{color:var(--red)} .s-none .dot,.s-expired .dot{background:var(--red)}
  .avatarsm{width:30px;height:30px;border-radius:50%;background:#e7e7f3;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:0 0 auto}
  .add-link{color:var(--cyan-d);cursor:pointer;font-weight:500;font-size:13px}
  .icon-btn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:12px;padding:2px 6px}
  .icon-btn:hover{color:var(--cyan-d)}
  .row-actions{text-align:right;white-space:nowrap}
  .note{color:var(--mut);font-size:12px;white-space:pre-wrap}
  .banner{background:#eaf6fc;border:1px solid #bfe4f5;color:#0e6b95;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
  /* modal */
  .mbg{position:fixed;inset:0;background:rgba(31,36,64,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .mbg.open{display:flex}
  .modal{background:var(--panel);border-radius:12px;width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:20px}
  .modal h3{margin:0 0 14px;color:var(--navy)}
  .modal .f{margin-bottom:11px}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;background:var(--soft);border:1px solid var(--line);color:var(--txt);border-radius:7px;font-size:13px;font-family:inherit}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--cyan)}
  .modal textarea{min-height:64px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .cf-row{display:flex;gap:8px;margin-top:10px}
  .cf-row input{flex:1}
  /* ===== CRM assistant ===== */
  .bot-fab{position:fixed;left:20px;bottom:20px;z-index:60;width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(38,39,109,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
  .bot-fab:hover{transform:translateY(-2px);background:var(--navy-d)}
  .bot-fab svg{width:26px;height:26px}
  .bot-fab .cydot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:2px solid #fff}
  .bot-panel{--bot-scale:1.15;position:fixed;left:20px;bottom:88px;z-index:61;width:392px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 120px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(31,36,64,.28);display:none;flex-direction:column;overflow:hidden}
  .bot-panel.open{display:flex}
  .bot-panel.full{left:0;top:0;bottom:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;border-radius:0}
  .bot-head{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 14px;flex:0 0 auto}
  .bot-head .t{font-weight:500;font-size:calc(14px * var(--bot-scale));line-height:1.2}
  .bot-head .t small{display:block;font-weight:400;font-size:calc(11px * var(--bot-scale));color:#b9c0e6;margin-top:2px}
  .bot-head .hbtns{margin-left:auto;display:flex;gap:6px}
  .bot-head .hbtn{background:rgba(255,255,255,.14);border:none;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:calc(15px * var(--bot-scale));line-height:1}
  .bot-head .hbtn:hover{background:rgba(255,255,255,.28)}
  .bot-msgs{flex:1;overflow-y:auto;padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
  .bot-panel.full .bmrow{width:100%;max-width:760px;margin:0 auto}
  .bmrow{display:flex;flex-direction:column}
  .bmrow.me{align-items:flex-end}
  .bubble{max-width:90%;padding:9px 12px;border-radius:12px;font-size:calc(13px * var(--bot-scale));line-height:1.6}
  .bubble.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:3px;color:var(--txt)}
  .bubble.me{background:var(--navy);color:#fff;border-top-right-radius:3px}
  .bubble a{color:var(--cyan-d);text-decoration:none;font-weight:500;cursor:pointer}
  .bubble.me a{color:#bfe4f5}
  .bot-res{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .rescard{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;cursor:pointer;transition:border-color .12s}
  .rescard:hover{border-color:var(--cyan)}
  .rescard .rn{font-weight:600;color:var(--navy);font-size:calc(13px * var(--bot-scale))}
  .rescard .rs{font-size:calc(11px * var(--bot-scale));color:var(--mut);margin-top:2px;line-height:1.45}
  .rescard .rpills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .reslinks{display:flex;gap:12px;margin-top:6px}
  .reslinks a{font-size:calc(11px * var(--bot-scale));color:var(--cyan-d);cursor:pointer;font-weight:500}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:calc(12px * var(--bot-scale));cursor:pointer;color:var(--navy)}
  .chip:hover{border-color:var(--cyan);color:var(--cyan-d)}
  .chip.go{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.go:hover{background:var(--navy-d);color:#fff}
  .chip.warn{background:#fff;border-color:var(--line);color:var(--mut)}
  .bot-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px;background:#fff;display:flex;align-items:flex-end;gap:8px}
  .bot-foot textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:calc(13px * var(--bot-scale));font-family:inherit;max-height:96px;outline:none;line-height:1.5}
  .bot-foot textarea:focus{border-color:var(--cyan)}
  .bot-foot .sbtn{background:var(--navy);color:#fff;border:none;border-radius:10px;width:38px;height:38px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--bot-scale))}
  .bot-foot .sbtn:hover{background:var(--navy-d)}
  .bot-foot .clip{background:var(--soft);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;flex:0 0 auto;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--bot-scale))}
  .bot-foot .clip:hover{border-color:var(--cyan);color:var(--cyan-d)}
  .bot-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px;background:#fff}
  .bot-sugg .chip{font-size:calc(11px * var(--bot-scale));padding:4px 9px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">UNITED <span>SERVICES</span></div>
    <div class="topsearch"><span style="color:#b9c0e6">&#9906;</span><input id="search" placeholder="Search companies, contacts..." oninput="render()"/></div>
    <button class="btn ghost" id="fuBtn" style="margin-left:auto" onclick="toggleFollowUps()">Follow-ups</button>
<button class="btn ghost" onclick="signOut()" title="Sign out and switch account">Sign out</button>
    <div class="avatar" id="avatarInits" style="margin-left:12px">GL</div>
  </div>
  <div class="body">
    <aside class="queue">
      <div class="qhead">
        <h2>Companies <span class="cnt" id="cnt"></span></h2>
        <button class="btn primary" onclick="openCompany()">+ New</button>
      </div>
      <div style="display:flex;gap:6px;padding:8px 13px 0">
        <span id="grp-all" onclick="setGrp('all')" style="cursor:pointer;font-size:12px;padding:4px 11px;border-radius:7px;background:var(--navy);color:#fff;font-weight:500">All</span>
        <span id="grp-prospects" onclick="setGrp('prospects')" style="cursor:pointer;font-size:12px;padding:4px 11px;border-radius:7px;border:1px solid var(--line);color:var(--mut)">Prospects</span>
        <span id="grp-existing" onclick="setGrp('existing')" style="cursor:pointer;font-size:12px;padding:4px 11px;border-radius:7px;border:1px solid var(--line);color:var(--mut)">Existing</span>
      </div>
      <div class="qfilters">
        <select id="fRel" onchange="render()"></select>
        <select id="fTier" onchange="render()"></select>
        <select id="fFit" onchange="render()"></select>
        <select id="fStage" onchange="render()"></select>
      </div>
      <div class="qlist" id="qlist"></div>
    </aside>
    <main class="detail" id="detail"><div class="empty">Select a company from the list.</div></main>
  </div>
</div>
<button class="bot-fab" id="botFab" onclick="botToggle()" title="Ask the CRM assistant" aria-label="Open CRM assistant">
  <span class="cydot"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div class="bot-panel" id="botPanel" ondragover="botDragOver(event)" ondrop="botDrop(event)">
  <div class="bot-head">
    <div class="t">CRM Assistant<small>Ask, find, upload, update</small></div>
    <div class="hbtns">
      <button class="hbtn" id="botFullBtn" onclick="botFull()" title="Open full page">&#11036;</button>
      <button class="hbtn" onclick="botToggle()" title="Close">&times;</button>
    </div>
  </div>
  <div class="bot-msgs" id="botMsgs"></div>
  <div class="bot-sugg" id="botSugg"></div>
  <div class="bot-foot">
    <button class="clip" onclick="botPickFile()" title="Upload a file">&#128206;</button>
    <input type="file" id="botFile" style="display:none" onchange="botFileChosen(this)"/>
    <textarea id="botInput" rows="1" placeholder="Ask about any company, contact, or document..." onkeydown="botKey(event)"></textarea>
    <button class="sbtn" onclick="botSend()" title="Send">&#10148;</button>
  </div>
</div>

<div class="mbg" id="m1"><div class="modal" id="m1in"></div></div>
<div class="mbg" id="m2"><div class="modal" id="m2in"></div></div>

<script>
const REL=["Developer","EPC","Developer / EPC","Electrical Contractor","Owner / IPP","Investor","Vendor / Supplier","Subcontractor","Government / Permitting","Community / NGO","Other"];
const STAGES=["Prospecting","Qualifying","NDA Signed","Active","Contract","Client","Dormant","Closed"];
const TIERS=["Suspect","Prospect","Client",""];
const FITS=["Strategic","High","Medium",""];
const DOCT=["NDA","MSA","Subcontract","Service Agreement","Insurance / COI","W-9 / Tax","Permit","Other"];
const DOCS=["Signed","Pending","Draft","Expired","None"];
function uiConfirm(msg){return new Promise(function(res){var bg=document.createElement("div");bg.className="mbg open";var m=document.createElement("div");m.className="modal";m.style.width="400px";var h=document.createElement("h3");h.textContent="Please confirm";var p=document.createElement("div");p.style.cssText="font-size:13px;margin-bottom:14px;white-space:pre-wrap";p.textContent=msg;var ft=document.createElement("div");ft.className="mfoot";var no=document.createElement("button");no.className="btn ghost";no.textContent="Cancel";var ok=document.createElement("button");ok.className="btn primary";ok.textContent="OK";ft.appendChild(no);ft.appendChild(ok);m.appendChild(h);m.appendChild(p);m.appendChild(ft);bg.appendChild(m);document.body.appendChild(bg);no.onclick=function(){bg.remove();res(false);};ok.onclick=function(){bg.remove();res(true);};});}

function fix(v){return v==="—"?"":v}
var OPTIONAL_COLS=["Address","LastOutreach","NextFollowUp"];
async function putFields(path,method,fields){
  var enc=function(f){return JSON.stringify(method==="POST"?{fields:f}:f);};
  try{return await graph(path,{method:method,body:enc(fields)});}
  catch(e){
    var has=OPTIONAL_COLS.filter(function(k){return k in fields;});
    if(!has.length)throw e;
    var f2={};Object.keys(fields).forEach(function(k){if(OPTIONAL_COLS.indexOf(k)<0)f2[k]=fields[k];});
    try{var r=await graph(path,{method:method,body:enc(f2)});r.__droppedCols=has;return r;}
    catch(e2){throw e;}
  }
}

      else{const r=await graph("/sites/"+SITE+"/lists/Contacts/items",{method:"POST",body:JSON.stringify({fields})});rec.id=r.id;rec.spId=r.id;c.contacts.push(rec);auditLog({entity:"Contacts",recordId:rec.spId,recordName:rec.name,company:c.name,action:"Add",summary:"Added contact",snapshot:contactSnap(rec)});}}catch(e){uiAlert("Save failed: "+(e.message||e));}

    try{const t=await tok();const safe=(c.name+"_"+g("y_type")+"_"+Date.now()+"_"+file.name).replace(/[^A-Za-z0-9._-]/g,"_");
      const up=await fetch("https://graph.microsoft.com/v1.0/sites/"+SITE+"/lists/"+DOCLIB+"/drive/root:/"+encodeURIComponent(safe)+":/content",{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":file.type||"application/octet-stream"},body:file});

      c.docs=c.docs||[];var _nd={spId:li.id,id:li.id,type:g("y_type"),status:g("y_status"),date:g("y_date"),link:drv.webUrl};c.docs.push(_nd);auditLog({entity:"Documents",recordId:li.id,recordName:_nd.type||"Document",company:c.name,action:"Upload",summary:"Uploaded "+(_nd.type||"document"),snapshot:docSnap(_nd)});
    }catch(e){uiAlert("Upload failed: "+(e.message||e));}
    detailView();return;}
  let arr,rec;
  if(kind==="event"){arr="events";rec={name:g("y_name").trim(),date:g("y_date"),location:g("y_location"),who:g("y_who"),notes:g("y_notes")};if(!rec.name){uiAlert("Event name required");return}}
  c[arr]=c[arr]||[];if(sid){Object.assign(c[arr].find(x=>x.id===sid),rec)}else{rec.id=id();c[arr].push(rec)}
  close2();detailView()}
async function delSub(arr,sid){if(!(await uiConfirm("Remove this record?")))return;const c=company();if(arr==="contacts"){const ex=c.contacts.find(x=>x.id===sid);try{await graph("/sites/"+SITE+"/lists/Contacts/items/"+ex.spId,{method:"DELETE"});}catch(e){uiAlert("Delete failed: "+(e.message||e));return;}auditLog({entity:"Contacts",recordId:ex.spId,recordName:ex.name,company:c.name,action:"Delete",summary:"Deleted contact",snapshot:contactSnap(ex)});}if(arr==="docs"){const ex=c.docs.find(x=>x.id===sid);try{await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+ex.spId,{method:"DELETE"});}catch(e){uiAlert("Delete failed: "+(e.message||e));return;}auditLog({entity:"Documents",recordId:ex.spId,recordName:ex.type||"Document",company:c.name,action:"Delete",summary:"Deleted document",snapshot:docSnap(ex)});}c[arr]=c[arr].filter(x=>x.id!==sid);detailView()}

function mapC(it){const f=it.fields||{};return{spId:it.id,id:it.id,name:f.Title||"",rel:f.RelationshipType||"Other",stage:f.Stage||"Prospecting",tier:f.Tier||"",fit:f.Fit||"",industry:f.CompanyType||"",website:f.Website||"",linkedin:f.LinkedIn||"",location:f.Location||"",address:f.Address||"",lastOutreach:(f.LastOutreach||"").slice(0,10),nextFollowUp:(f.NextFollowUp||"").slice(0,10),owner:f.Owner||"",notes:f.Notes||"",dept:f.Department||"Business Development",legal:{},custom:[{k:"US Registration",v:f.USRegistration||""},{k:"Phone",v:f.Phone||""},{k:"General email",v:f.GeneralEmail||""}].filter(x=>x.v),contacts:[],docs:[],events:[]};}

async function pageAll(url){let out=[];while(url){const j=await graph(url);out=out.concat(j.value||[]);url=j["@odata.nextLink"]?j["@odata.nextLink"].replace("https://graph.microsoft.com/v1.0",""):null;}return out;}

<script>
/* ================= CRM Audit / Version History ================= */
var AUDIT={listId:null,ready:false,checked:false,me:null,mem:[],error:""};
var AUDIT_LIST_NAME="CRM Change Log";
var AUDIT_STASH={};

function auditStash(e){var k="h"+Date.now()+Math.floor(Math.random()*1e4);AUDIT_STASH[k]=e;return k;}
function companySnap(c){return {name:c.name,rel:c.rel,stage:c.stage,tier:c.tier,fit:c.fit,industry:c.industry,website:c.website,linkedin:c.linkedin,location:c.location,address:c.address,lastOutreach:c.lastOutreach,nextFollowUp:c.nextFollowUp,owner:c.owner,notes:c.notes,dept:c.dept,legal:c.legal?JSON.parse(JSON.stringify(c.legal)):{}};}
function contactSnap(p){return {name:p.name,role:p.role,email:p.email,phone:p.phone,linkedin:p.linkedin,last:p.last,notes:p.notes};}
function docSnap(d){return {type:d.type,status:d.status,date:d.date,link:d.link};}
function companyFields(d){return {Title:d.name,RelationshipType:d.rel,Stage:d.stage,Tier:d.tier,Fit:d.fit,CompanyType:d.industry,Website:d.website,LinkedIn:d.linkedin,Location:d.location,Address:d.address,LastOutreach:d.lastOutreach?d.lastOutreach+"T00:00:00Z":null,NextFollowUp:d.nextFollowUp?d.nextFollowUp+"T00:00:00Z":null,Owner:d.owner,Notes:d.notes};}
function contactFields(rec,company){var f={Title:rec.name,Company:company,Role:rec.role,Email:rec.email,Phone:rec.phone,LinkedIn:rec.linkedin,Notes:rec.notes};if(rec.last)f.LastContact=rec.last+"T00:00:00Z";return f;}
function auditDiff(before,after,keys){var out=[];keys.forEach(function(k){var a=before?before[k]:"",b=after?after[k]:"";if(String(a==null?"":a)!==String(b==null?"":b))out.push(k+': "'+(a==null?"":a)+'" to "'+(b==null?"":b)+'"');});return out.length?out.join("; "):"No field values changed";}
function auditFmtWhen(w){if(!w)return "";var d=new Date(w);return isNaN(d.getTime())?String(w):d.toLocaleString();}

async function auditMe(){
  if(AUDIT.me)return AUDIT.me;
  try{var m=await graph("/me?$select=displayName,userPrincipalName,mail");AUDIT.me={name:m.displayName||m.userPrincipalName||"Unknown",login:m.userPrincipalName||m.mail||""};}
  catch(e){try{var a=pca.getAllAccounts()[0];AUDIT.me={name:(a&&a.name)||"Unknown",login:(a&&a.username)||""};}catch(_){AUDIT.me={name:"Unknown",login:""};}}
  return AUDIT.me;
}

async function auditEnsureList(){
  if(AUDIT.checked)return AUDIT.ready;
  AUDIT.checked=true;
  try{
    var lists=await graph("/sites/"+SITE+"/lists?$select=id,displayName,name&$top=200");
    var ex=(lists.value||[]).find(function(l){return l.displayName===AUDIT_LIST_NAME||l.name===AUDIT_LIST_NAME;});
    if(ex){AUDIT.listId=ex.id;AUDIT.ready=true;return true;}
    var body={displayName:AUDIT_LIST_NAME,list:{template:"genericList"},columns:[
      {name:"Entity",text:{}},{name:"RecordId",text:{}},{name:"RecordName",text:{}},{name:"Company",text:{}},
      {name:"Action",text:{}},{name:"FieldChanged",text:{}},{name:"Summary",text:{allowMultipleLines:true}},
      {name:"Snapshot",text:{allowMultipleLines:true}},{name:"ChangedByName",text:{}},{name:"ChangedByLogin",text:{}},
      {name:"ChangedAt",dateTime:{}}
    ]};
    var made=await graph("/sites/"+SITE+"/lists",{method:"POST",body:JSON.stringify(body)});
    AUDIT.listId=made.id;AUDIT.ready=true;return true;
  }catch(e){AUDIT.ready=false;AUDIT.error=(e&&e.message)||String(e);return false;}
}

async function auditLog(entry){
  try{
    var me=await auditMe();
    var now=new Date().toISOString();
    var rec={entity:entry.entity||"",recordId:entry.recordId||"",recordName:entry.recordName||"",company:entry.company||"",action:entry.action||"",field:entry.field||"",summary:entry.summary||"",snapshot:entry.snapshot||null,byName:me.name,byLogin:me.login,when:now,persisted:false};
    AUDIT.mem.unshift(rec);
    var ok=await auditEnsureList();
    if(!ok)return;
    var fields={Title:(rec.recordName||"record")+": "+(rec.action||"change"),Entity:rec.entity,RecordId:String(rec.recordId),RecordName:rec.recordName,Company:rec.company,Action:rec.action,FieldChanged:rec.field,Summary:rec.summary,Snapshot:rec.snapshot?JSON.stringify(rec.snapshot):"",ChangedByName:me.name,ChangedByLogin:me.login,ChangedAt:now};
    await graph("/sites/"+SITE+"/lists/"+AUDIT.listId+"/items",{method:"POST",body:JSON.stringify({fields:fields})});
    rec.persisted=true;
  }catch(e){}
}

async function auditFetchForCompany(c){
  var out=[];
  var ok=await auditEnsureList();
  if(ok){
    try{
      var items=await graph("/sites/"+SITE+"/lists/"+AUDIT.listId+"/items?$expand=fields&$top=500");
      (items.value||[]).forEach(function(it){var f=it.fields||{};if(f.Company===c.name){out.push({id:it.id,entity:f.Entity,recordId:f.RecordId,recordName:f.RecordName,company:f.Company,action:f.Action,field:f.FieldChanged,summary:f.Summary,snapshot:f.Snapshot,byName:f.ChangedByName,byLogin:f.ChangedByLogin,when:f.ChangedAt||it.lastModifiedDateTime});}});
    }catch(e){}
  }
  AUDIT.mem.forEach(function(m){if(m.company===c.name&&!m.persisted)out.push(Object.assign({session:true},m));});
  out.sort(function(a,b){return String(b.when||"").localeCompare(String(a.when||""));});
  return out;
}

async function openHistory(cid){
  var c=DB.companies.find(function(x){return x.id===cid;})||company();if(!c)return;
  AUDIT_STASH={};
  m1in.innerHTML='<h3>History: '+esc(c.name)+'</h3><div class="note">Loading change log...</div><div class="mfoot"><button class="btn ghost" onclick="close1()">Close</button></div>';
  m1.classList.add("open");
  var rows=await auditFetchForCompany(c);
  var body="";
  if(!AUDIT.ready){body+='<div class="note" style="margin-bottom:8px">History is not permanent yet. A SharePoint list named "'+esc(AUDIT_LIST_NAME)+'" is needed on the United Services Teams site, which a site owner can create. Until then this shows only changes made in this browser session.</div>';}
  if(!rows.length){body+='<div class="note">No changes recorded yet for '+esc(c.name)+'.</div>';}
  else{body+=rows.map(function(e){
    var hasSnap=e.snapshot&&(typeof e.snapshot!=="string"||e.snapshot.length>2);
    var canRestore=(e.action==="Edit"||e.action==="Delete")&&hasSnap;
    var key=canRestore?auditStash(e):"";
    return '<div class="rescard" style="cursor:default"><div class="rn">'+esc(e.action||"Change")+' &middot; '+esc(e.entity||"")+': '+esc(e.recordName||"")+'</div>'+
      '<div class="rs">by '+esc(e.byName||"Unknown")+' &middot; '+esc(auditFmtWhen(e.when))+(e.session?' &middot; not yet saved':'')+'</div>'+
      (e.summary?'<div class="rs">'+esc(e.summary)+'</div>':'')+
      (canRestore?'<div style="margin-top:6px"><button class="btn ghost" onclick="auditRestore(\''+key+'\')">Restore this version</button></div>':'')+
    '</div>';
  }).join("");}
  m1in.innerHTML='<h3>History: '+esc(c.name)+'</h3><div class="bot-res" style="max-height:52vh;overflow:auto">'+body+'</div><div class="mfoot"><button class="btn ghost" onclick="close1()">Close</button></div>';
}

async function auditRestore(key){
  var e=AUDIT_STASH[key];if(!e)return;
  var snap=e.snapshot;if(typeof snap==="string"){try{snap=JSON.parse(snap);}catch(_){snap=null;}}
  if(!snap){uiAlert("No snapshot stored for this entry, so it cannot be restored.");return;}
  if(!(await uiConfirm('Restore this '+e.entity+' to the version from '+auditFmtWhen(e.when)+'? This saves the change and logs a new history entry.')))return;
  try{
    if(e.entity==="Companies"){
      var c=DB.companies.find(function(x){return String(x.spId)===String(e.recordId);})||DB.companies.find(function(x){return x.name===snap.name;});
      var f1=companyFields(snap);
      if(c&&c.spId){await graph("/sites/"+SITE+"/lists/Companies/items/"+c.spId+"/fields",{method:"PATCH",body:JSON.stringify(f1)});Object.assign(c,snap);}
      else{var r=await graph("/sites/"+SITE+"/lists/Companies/items",{method:"POST",body:JSON.stringify({fields:f1})});var n=Object.assign({custom:[],contacts:[],docs:[],events:[]},snap,{id:r.id,spId:r.id});DB.companies.unshift(n);sel=n.id;}
    }else if(e.entity==="Contacts"){
      var parent=DB.companies.find(function(x){return x.name===e.company;});
      if(!parent){uiAlert("The parent company is not loaded, so this contact cannot be restored.");return;}
      var f2=contactFields(snap,e.company);
      var ex=(parent.contacts||[]).find(function(x){return String(x.spId)===String(e.recordId);});
      if(ex&&ex.spId){await graph("/sites/"+SITE+"/lists/Contacts/items/"+ex.spId+"/fields",{method:"PATCH",body:JSON.stringify(f2)});Object.assign(ex,snap);}
      else{var r2=await graph("/sites/"+SITE+"/lists/Contacts/items",{method:"POST",body:JSON.stringify({fields:f2})});var nc=Object.assign({},snap,{id:r2.id,spId:r2.id});parent.contacts=parent.contacts||[];parent.contacts.push(nc);}
    }else{uiAlert("Restore is available for company and contact records. A document can be re-uploaded from the original file.");return;}
    await auditLog({entity:e.entity,recordId:e.recordId,recordName:e.recordName,company:e.company,action:"Restore",summary:"Restored to the version from "+auditFmtWhen(e.when),snapshot:snap});
    render();detailView();
    var cc=DB.companies.find(function(x){return x.name===e.company;});
    if(cc)openHistory(cc.id);
    uiAlert("Restored.");
  }catch(err){uiAlert("Restore failed: "+(err.message||err));}
}
</script>
<script>
/* ================= CRM Assistant ================= */
var BOT={open:false,full:false,ctx:null,pending:null,file:null,greeted:false};

/* ---- interpretation layer (Claude proxy seam) ----
   Set BOT_PROXY_URL to your in-tenant Azure proxy to turn on Claude interpretation.
   The proxy receives ONLY the user's question plus the system prompt below, never CRM
   records, so client data stays in the tenant. It must return JSON shaped as either:
     { "plan":   "<canonical query string>" }  -> fed into the local engine (botParse)
     { "answer": "<html string>" }             -> shown to the user as-is
   If BOT_PROXY_URL is empty, or the call fails, we fall back to the local parser and
   the app behaves exactly as before. */
var BOT_PROXY_URL="";

var BOT_SYSTEM_PROMPT=`# CRM Assistant, Operating Instructions

## Role
You are the CRM Assistant for United Services. You retrieve client information, present it in a fixed, decision-ready format, and manage client files under strict human approval. You are precise, structured, and never guess. When you lack certainty, you say so and ask.

## Core Principles
1. Summary first, always. Every information response opens with a one line summary of what you found before any detail or raw resource.
2. No silent file actions. You never save, move, or overwrite a file without an explicit human "Approve."
3. Show your reasoning on placement. When you propose where a file goes, you state why so the human can correct you.
4. Cite the source. Every fact you present links back to the SharePoint or GitHub location it came from.
5. If unsure, ask one sharp question. Do not fabricate a status, a folder, or a next action.

## 1. Information Retrieval and Presentation
When the user asks for anything about a client (status, history, contacts, recent outreach, documents), follow this sequence.
Step 1. Retrieve. Search the relevant SharePoint site, client folder, and any linked GitHub records. Pull the actual resources.
Step 2. Lead with a summary. Open every response with a single summary line before anything else.
Step 3. Deliver in the fixed format below.

### Fixed format for a single client status query
[Client Name], Status Summary
The status on [Client Name] is [status].
Currently processing: [what is in motion right now].
Next action: [the specific next step, owner, and due date if known].
Source: [linked SharePoint or GitHub location]

### Fixed format for a multi-client or list query
When asked to "pull up all clients we've reached out to recently" or any list, open with a count and time window, then a clean table with columns: Client, Status, Currently Processing, Next Action, Source. Sort by most recent activity unless the user specifies otherwise. Close with: "Want me to open any of these in full?"

### Rules for presentation
- If a field is unknown, write Unknown rather than inventing it, and note what would fill the gap.
- If multiple clients match an ambiguous name, list the candidates and ask which one before pulling detail.
- Never dump raw file contents without the summary on top.
- Keep the summary to what a busy executive needs to decide the next move.

## 2. File Management and Human Supervision
When the user says "Add this file to [client]" or uploads a file for a client, you never save it directly. You propose, you wait, you act only on approval.
Step 1. Scan for the right destination. Read the file name and contents, identify the client, and search that client's SharePoint folder structure for the most relevant subfolder (for example: Contracts, Proposals, Correspondence, Financials, Site Docs). Match by document type and existing naming conventions.
Step 2. Propose with reasoning, then ask for approval. Present File, Client, Destination, and a one line "Why here", then stop and ask the user to reply "Approve" to save or "Edit" to redirect.
Step 3. Wait for a human decision. Do not save until you receive an explicit "Approve." No approval means no write.
Step 4. Support Edit and guidance. If the user replies "Edit," names a different folder, or gives any correction, restate the revised proposal in the same format and ask for approval again. Loop until approved or cancelled.
Step 5. Confirm the completed action. After approval and save, confirm with the final path and a link.

### Rules for file handling
- Only one write per approval. If the user approves, then adds a second file, run the full propose and approve loop again.
- Never overwrite an existing file. If a file of the same name exists, flag it and ask whether to replace, version, or rename.
- If you cannot confidently identify the client or the folder, do not guess. Propose your best option, state your uncertainty, and ask.
- If the destination sits in GitHub rather than SharePoint, name the repo and path in the same proposal format and hold for approval identically.
- Every proposal and every confirmation includes the full path so the human always sees exactly where the file lands.

## Hard Guardrails
1. Summary before detail on every information response. No exceptions.
2. No file write, move, or overwrite without an explicit human "Approve."
3. Never invent a status, folder, contact, or next action. Unknown is a valid answer.
4. Always cite the source location.
5. When ambiguous, ask one clear question rather than proceeding.`;

async function botInterpret(text){
  // With a proxy configured, Claude reads the question (guided by BOT_SYSTEM_PROMPT) and
  // returns either a canonical query plan or a ready-to-show answer. Guardrails such as
  // confirm-before-write stay enforced by the local code regardless of the interpreter.
  if(BOT_PROXY_URL){
    try{
      var r=await fetch(BOT_PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:BOT_SYSTEM_PROMPT,message:text})});
      if(r.ok){
        var d=await r.json();
        if(d&&typeof d.answer==="string"&&d.answer)return {type:"answer",html:d.answer};
        if(d&&typeof d.plan==="string"&&d.plan)return botParse(d.plan);
      }
    }catch(e){ /* fall through to local parsing */ }
  }
  // No proxy, or the call failed: parse locally so no CRM data leaves the tenant.
  return botParse(text);
}

function botNorm(s){return (s||"").toLowerCase().replace(/[^a-z0-9\/\-\s]/g," ").replace(/\s+/g," ").trim();}

function botMatchCompanies(text){
  var q=botNorm(text);
  if(!q)return [];
  var scored=DB.companies.map(function(c){
    var n=botNorm(c.name);
    var s=0;
    if(n===q)s=100;
    else if(q.indexOf(n)>-1&&n.length>2)s=80;
    else if(n.indexOf(q)>-1)s=60;
    else{
      var qt=q.split(" "),nt=n.split(" "),hit=0;
      qt.forEach(function(w){if(w.length>2&&nt.indexOf(w)>-1)hit++;});
      if(hit)s=30+hit*10;
    }
    return {c:c,s:s};
  }).filter(function(x){return x.s>0;});
  scored.sort(function(a,b){return b.s-a.s;});
  return scored;
}

function botMatchOneCompany(text){
  var m=botMatchCompanies(text);
  if(!m.length)return null;
  if(m.length===1||m[0].s>=80||(m[1]&&m[0].s-m[1].s>=20))return m[0].c;
  return null;
}

function botExtractFilters(q){
  var f={},used=[];
  Object.keys(B_TIER).forEach(function(k){var re=new RegExp("(^|\\s)(tier\\s)?"+k+"(\\s|$)");});
  // tier
  if(/\bsuspects?\b/.test(q))f.tier="Suspect";
  else if(/\bclients?\b/.test(q))f.tier="Client";
  else if(/\bprospects?\b/.test(q))f.tier="Prospect";
  // fit
  Object.keys(B_FIT).forEach(function(k){if(new RegExp("\\b"+k+"\\b").test(q))f.fit=B_FIT[k];});
  // stage
  Object.keys(B_STAGE).forEach(function(k){if(new RegExp("\\b"+k+"\\b").test(q))f.stage=B_STAGE[k];});
  // relationship / type
  for(var i=0;i<B_REL.length;i++){if(q.indexOf(B_REL[i][0])>-1){f.rel=B_REL[i][1];f.relKey=B_REL[i][0];break;}}
  // location
  for(var s=0;s<B_STATES.length;s++){if(q.indexOf(B_STATES[s])>-1){f.loc=B_STATES[s];break;}}
  // document conditions
  var docType=null;
  for(var d=0;d<B_DOCT.length;d++){if(q.indexOf(B_DOCT[d][0])>-1){docType=B_DOCT[d][1];break;}}
  if(docType){
    var neg=/(\bno\b|without|missing|lack|lacking|don'?t have|not signed|unsigned|need|needs)/.test(q);
    var signed=/\bsigned\b/.test(q)&&!/not signed/.test(q);
    var expired=/expired/.test(q);
    var pending=/pending/.test(q);
    f.doc={type:docType,neg:neg,signed:signed,expired:expired,pending:pending};
  }
  // recency / stale
  var rm=q.match(/(\d+)\s*(day|week|month)/);
  if(/stale|haven'?t (contacted|reached|talked)|not (contacted|reached|touched)|no contact|gone (cold|quiet)/.test(q)||rm){
    var days=60;
    if(rm){days=parseInt(rm[1],10);if(rm[2]==="week")days*=7;if(rm[2]==="month")days*=30;}
    f.staleDays=days;
  }
  return f;
}

function botHasFilters(f){return !!(f.tier||f.fit||f.stage||f.rel||f.loc||f.doc||f.staleDays);}

function botApplyFilters(f){
  var now=Date.now();
  return DB.companies.filter(function(c){
    if(f.tier&&c.tier!==f.tier)return false;
    if(f.fit&&c.fit!==f.fit)return false;
    if(f.stage&&c.stage!==f.stage)return false;
    if(f.relKey&&botNorm(c.rel).indexOf(f.relKey)<0)return false;
    if(f.loc&&botNorm(c.location).indexOf(f.loc)<0)return false;
    if(f.doc){
      var d=(c.docs||[]).find(function(x){return x.type===f.doc.type;});
      if(f.doc.neg){ if(d&&d.status==="Signed")return false; }
      else if(f.doc.signed){ if(!(d&&d.status==="Signed"))return false; }
      else if(f.doc.expired){ if(!(d&&d.status==="Expired"))return false; }
      else if(f.doc.pending){ if(!(d&&d.status==="Pending"))return false; }
      else { if(!d)return false; }
    }
    if(f.staleDays){
      var last=0;(c.contacts||[]).forEach(function(p){if(p.last){var t=Date.parse(p.last);if(t>last)last=t;}});
      var thr=now-f.staleDays*864e5;
      if(last>=thr)return false; // recently contacted -> exclude
    }
    return true;
  });
}

function botFilterLabel(f){
  var p=[];
  if(f.rel)p.push(f.rel);
  if(f.tier)p.push(f.tier);
  if(f.fit)p.push(f.fit+" fit");
  if(f.stage)p.push(f.stage);
  if(f.loc)p.push("in "+f.loc.replace(/\b\w/g,function(m){return m.toUpperCase();}));
  if(f.doc){p.push((f.doc.neg?"without a signed ":(f.doc.signed?"with a signed ":(f.doc.expired?"with an expired ":(f.doc.pending?"with a pending ":"with a "))))+f.doc.type);}
  if(f.staleDays)p.push("not contacted in "+f.staleDays+" days");
  return p.join(", ");
}

/* ---- action parsing (edits by command) ---- */
function botParseAction(text){
  var q=botNorm(text);
  // add contact NAME to COMPANY
  var m=text.match(/add (?:a )?contact\s+(.+?)\s+(?:to|at|for)\s+(.+)/i)||text.match(/add\s+(.+?)\s+as (?:a )?contact\s+(?:to|at|for)\s+(.+)/i);
  if(m){var comp=botMatchOneCompany(m[2]);if(comp)return {kind:"addContact",company:comp,name:m[1].trim()};return {kind:"needCompany",raw:m[2]};}
  // mark/set COMPANY DOCTYPE as/to STATUS
  if(/\b(mark|set|update|change)\b/.test(q)){
    var dt=null;for(var d=0;d<B_DOCT.length;d++){if(q.indexOf(B_DOCT[d][0])>-1){dt=B_DOCT[d][1];break;}}
    var st=null;["signed","pending","draft","expired","none"].forEach(function(s){if(new RegExp("\\b"+s+"\\b").test(q))st=s.charAt(0).toUpperCase()+s.slice(1);});
    if(dt&&st){var comp2=botFindCompanyInText(text);if(comp2)return {kind:"docStatus",company:comp2,type:dt,status:st};}
    // set COMPANY tier/fit/stage to VALUE
    var tm=q.match(/\btier\s+(?:to\s+)?(?:tier\s+)?(a|b|c)\b/);if(tm){var comp3=botFindCompanyInText(text);if(comp3)return {kind:"field",company:comp3,field:"tier",value:B_TIER[tm[1]],label:"tier",disp:B_TIER[tm[1]]};}
    var fitK=Object.keys(B_FIT).find(function(k){return new RegExp("\\b"+k+"\\b").test(q);});
    if(/\bfit\b/.test(q)&&fitK){var comp4=botFindCompanyInText(text);if(comp4)return {kind:"field",company:comp4,field:"fit",value:B_FIT[fitK],label:"fit",disp:B_FIT[fitK]};}
    var stgK=Object.keys(B_STAGE).find(function(k){return new RegExp("\\b"+k+"\\b").test(q);});
    if(/\bstage\b/.test(q)&&stgK){var comp5=botFindCompanyInText(text);if(comp5)return {kind:"field",company:comp5,field:"stage",value:B_STAGE[stgK],label:"stage",disp:B_STAGE[stgK]};}
  }
  return null;
}

function botFindCompanyInText(text){
  // try to find the best-matching company name mentioned anywhere in the text
  var best=null,bestScore=0;
  DB.companies.forEach(function(c){
    var n=botNorm(c.name);
    if(n.length>2&&botNorm(text).indexOf(n)>-1&&n.length>bestScore){best=c;bestScore=n.length;}
  });
  return best;
}

/* ---- master parse ---- */
function botParse(text){
  var q=botNorm(text);
  if(!q)return {type:"help"};
  if(/^(hi|hey|hello|help|what can you)/.test(q))return {type:"help"};
  // actions first
  if(/\b(add|mark|set|update|change)\b/.test(q)){
    var act=botParseAction(text);
    if(act&&act.kind!=="needCompany")return {type:"action",action:act};
    if(act&&act.kind==="needCompany")return {type:"answer",html:"I couldn't match a company called \""+esc(act.raw)+"\". Try the exact name."};
  }
  // upload intent
  if(/\b(upload|attach|file this|add (?:a )?(?:file|document|doc)|drop)\b/.test(q)){
    var uc=botFindCompanyInText(text);
    return {type:"upload",company:uc};
  }
  // count
  var isCount=/^(how many|count|number of)/.test(q);
  // filters
  var f=botExtractFilters(q);
  if(botHasFilters(f)){
    var list=botApplyFilters(f);
    return {type:"list",label:botFilterLabel(f),companies:list,count:isCount};
  }
  // direct field questions about one company
  var comp=botMatchOneCompany(text);
  if(comp){
    if(/contact|who.*(talk|speak|know)|point of contact|poc/.test(q))return {type:"company",company:comp,focus:"contacts"};
    if(/email|phone|number/.test(q))return {type:"company",company:comp,focus:"contacts"};
    if(/document|nda|msa|insurance|contract|paperwork|signed/.test(q))return {type:"company",company:comp,focus:"documents"};
    if(/event|conference|networking/.test(q))return {type:"company",company:comp,focus:"events"};
    if(/website|linkedin|owner|stage|tier|fit|location|where/.test(q))return {type:"company",company:comp,focus:"overview"};
    return {type:"company",company:comp,focus:"status"};
  }
  // contact name search
  var cmatch=[];
  DB.companies.forEach(function(c){(c.contacts||[]).forEach(function(p){if(botNorm(p.name).indexOf(q)>-1&&q.length>2)cmatch.push({p:p,c:c});});});
  if(cmatch.length)return {type:"contacts",matches:cmatch,q:text};
  // fuzzy fallback across everything
  var fuzzy=DB.companies.filter(function(c){
    var hay=botNorm(c.name+" "+c.industry+" "+c.location+" "+c.notes+" "+(c.contacts||[]).map(function(x){return x.name+" "+x.role;}).join(" "));
    return q.split(" ").some(function(w){return w.length>2&&hay.indexOf(w)>-1;});
  });
  if(fuzzy.length)return {type:"list",label:"matching \""+text.trim()+"\"",companies:fuzzy,count:false};
  var _nc=botMatchCompanies(text).map(function(x){return x.c;});
  if(!_nc.length)_nc=botCloseMatches(text).map(function(x){return x.c;});
  _nc=_nc.slice(0,3);
  var _nh=_nc.length?(" Closest matches: "+_nc.map(function(x){return botLink(x);}).join(", ")+"."):"";
  return {type:"answer",html:"Nothing in SharePoint or GitHub matched <strong>"+esc(text.trim())+"</strong>."+_nh+" Try a client name, or a filter like \"qualifying clients\" or \"EPCs in Texas\"."};
}

function botLastContact(c){

  (c.contacts||[]).forEach(function(p){if(p&&p.last){var t=Date.parse(p.last);if(!isNaN(t)&&t>bestT){bestT=t;best=p.last;}}});
  return best;

function botCustomVal(c,keys){
  var cf=c.custom||[];
  for(var i=0;i<cf.length;i++){var k=(cf[i].k||"").toLowerCase();for(var j=0;j<keys.length;j++){if(k.indexOf(keys[j])>-1&&cf[i].v)return cf[i].v;}}
  return "";
}

function botNextVal(c){return c.nextAction||c.next||botCustomVal(c,["next action","next step","next"])||"";}
function botLev(a,b){a=a||"";b=b||"";var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++){var c=a.charAt(i-1)===b.charAt(j-1)?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);}return d[m][n];}
function botCloseMatches(text){
  var q=botNorm(text);if(!q)return [];
  var scored=DB.companies.map(function(c){var n=botNorm(c.name);var sim=1-botLev(q,n)/Math.max(q.length,n.length,1);return {c:c,sim:sim};}).filter(function(x){return x.sim>=0.5;});
  scored.sort(function(a,b){return b.sim-a.sim;});
  return scored.slice(0,3);
}

    botCtxSet(c.id);
    if(res.focus==="status"){botSayStatus(c);return;}
    var h="<strong>"+botLink(c)+"</strong> &middot; "+esc(c.rel)+(c.location?" &middot; "+esc(c.location):"")+"<div class='bot-res'>";
    if(res.focus==="contacts"){
      var ppl=(c.contacts||[]);
      if(ppl.length){h+=ppl.map(function(p){return '<div class="rescard" onclick="botGo(\''+c.id+'\',\'contacts\')"><div class="rn">'+esc(p.name)+'</div><div class="rs">'+esc(p.role||"")+(p.email?' &middot; '+esc(p.email):'')+(p.phone?' &middot; '+esc(p.phone):'')+'</div></div>';}).join("");}
      else h+='<div class="note">No contacts recorded yet. You can add one: "add contact NAME to '+esc(c.name)+'".</div>';
    } else if(res.focus==="documents"){
      var dd=(c.docs||[]);
      var want=["NDA","MSA","Insurance / COI"];
      h+='<div class="rescard" onclick="botGo(\''+c.id+'\',\'documents\')">'+want.map(function(t){var x=dd.find(function(z){return z.type===t;});var s=x?x.status:"None";return '<div class="rs" style="margin:2px 0"><strong>'+t+':</strong> '+s+'</div>';}).join("")+'</div>';
      h+='<div class="note" style="margin-top:4px">'+botLink(c,"Open documents","documents")+' or drop a file here to upload one.</div>';
    } else if(res.focus==="events"){
      var ev=(c.events||[]);
      if(ev.length)h+=ev.map(function(e){return '<div class="rescard" onclick="botGo(\''+c.id+'\',\'events\')"><div class="rn">'+esc(e.name)+'</div><div class="rs">'+esc(e.date||"")+(e.location?' &middot; '+esc(e.location):'')+'</div></div>';}).join("");
      else h+='<div class="note">No events tracked yet for '+esc(c.name)+'.</div>';
    } else {
      h+=botCard(c);
    }
    h+="</div>";
    botSay(h);
    return;
  }
  if(res.type==="contacts"){
    var head2="Found <strong>"+res.matches.length+"</strong> contact"+(res.matches.length===1?"":"s")+":";
    var body2='<div class="bot-res">'+res.matches.slice(0,12).map(function(m){return '<div class="rescard" onclick="botGo(\''+m.c.id+'\',\'contacts\')"><div class="rn">'+esc(m.p.name)+'</div><div class="rs">'+esc(m.p.role||"")+' at '+esc(m.c.name)+(m.p.email?' &middot; '+esc(m.p.email):'')+'</div></div>';}).join("")+'</div>';
    botSay(head2+body2);
    return;
  }
  if(res.type==="upload"){
    if(res.company){botCtxSet(res.company.id);botSay("Sure. Attach a file and I'll file it under <strong>"+esc(res.company.name)+"</strong>.");botPickFile();}
    else {botSay("Which client should the file go under? You can tell me the name, then attach the file.");}
    return;
  }
  if(res.type==="action"){botConfirmAction(res.action);return;}
}

/* ---- actions with confirmation ---- */
function botConfirmAction(a){
  var msg="",id=botStash(a);
  if(a.kind==="field")msg="Set <strong>"+esc(a.company.name)+"</strong> "+a.label+" to <strong>"+esc(a.disp)+"</strong>?";
  else if(a.kind==="docStatus")msg="Mark <strong>"+esc(a.company.name)+"</strong> "+esc(a.type)+" as <strong>"+esc(a.status)+"</strong>?";
  else if(a.kind==="addContact")msg="Add contact <strong>"+esc(a.name)+"</strong> to <strong>"+esc(a.company.name)+"</strong>?";
  botSay(msg+'<div class="chips"><span class="chip go" onclick="botRunStashed(\''+id+'\')">Confirm</span><span class="chip warn" onclick="botCancelStashed(\''+id+'\')">Cancel</span></div>');
}
var BOT_STASH={};
function botStash(a){var k="a"+Date.now()+Math.floor(Math.random()*1000);BOT_STASH[k]=a;return k;}
function botCancelStashed(k){delete BOT_STASH[k];botSay("Okay, no change made.");}
async function botRunStashed(k){var a=BOT_STASH[k];if(!a)return;delete BOT_STASH[k];await botRunAction(a);}

async function botRunAction(a){
  try{
    if(a.kind==="field"){
      var colMap={tier:"Tier",fit:"Fit",stage:"Stage"};
      var _bf=(typeof companySnap==="function")?companySnap(a.company):null;
      a.company[a.field]=a.value;
      var body={};body[colMap[a.field]]=a.value;
      await graph("/sites/"+SITE+"/lists/Companies/items/"+a.company.spId+"/fields",{method:"PATCH",body:JSON.stringify(body)});
      if(typeof auditLog==="function")auditLog({entity:"Companies",recordId:a.company.spId,recordName:a.company.name,company:a.company.name,action:"Edit",summary:a.label+' set to "'+a.disp+'"',snapshot:_bf});
      botSay("Done. "+botLink(a.company)+" "+a.label+" is now <strong>"+esc(a.disp)+"</strong>.");
    } else if(a.kind==="docStatus"){
      var d=(a.company.docs||[]).find(function(x){return x.type===a.type;});
      if(!d){botSay("There's no "+esc(a.type)+" on file for "+esc(a.company.name)+" yet, so there's nothing to update. Upload the "+esc(a.type)+" file and it will be recorded. "+botLink(a.company,"Open documents","documents"));return;}
      var _bds=(typeof docSnap==="function")?docSnap(d):null;
      d.status=a.status;
      await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+d.spId+"/fields",{method:"PATCH",body:JSON.stringify({Status:a.status})});
      if(typeof auditLog==="function")auditLog({entity:"Documents",recordId:d.spId,recordName:a.type,company:a.company.name,action:"Edit",summary:a.type+' status set to "'+a.status+'"',snapshot:_bds});
      botSay("Done. "+esc(a.type)+" for "+botLink(a.company)+" is now <strong>"+esc(a.status)+"</strong>. "+botLink(a.company,"View","documents"));
    } else if(a.kind==="addContact"){
      var fields={Title:a.name,Company:a.company.name};
      var r=await graph("/sites/"+SITE+"/lists/Contacts/items",{method:"POST",body:JSON.stringify({fields:fields})});
      a.company.contacts=a.company.contacts||[];var _ncc={id:r.id,spId:r.id,name:a.name,role:"",email:"",phone:"",linkedin:"",last:"",notes:""};a.company.contacts.push(_ncc);
      if(typeof auditLog==="function")auditLog({entity:"Contacts",recordId:r.id,recordName:a.name,company:a.company.name,action:"Add",summary:"Added contact via assistant",snapshot:(typeof contactSnap==="function")?contactSnap(_ncc):_ncc});
      botSay("Added <strong>"+esc(a.name)+"</strong> to "+botLink(a.company,a.company.name,"contacts")+". Open the contact to add their role and email.");
    }
    if(sel===a.company.id){render();detailView();} else render();
  }catch(e){botSay("That didn't save: "+esc(e.message||String(e)));}
}

/* ---- file upload flow ---- */
function botPickFile(){document.getElementById("botFile").click();}
function botFileChosen(el){var f=el.files&&el.files[0];if(!f)return;el.value="";botStartUpload(f);}
function botDragOver(e){e.preventDefault();}
function botDrop(e){e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)botStartUpload(f);}
function botStartUpload(f){
  BOT.file=f;
  if(!BOT.open)botToggle();
  if(BOT.ctx){botProposeUpload();}
  else{botSay('Got <strong>'+esc(f.name)+'</strong>. Which client should I file it under? Type the company name.');BOT.pending={kind:"uploadCompany"};}
}
function botAskDocType(){
  var c=DB.companies.find(function(x){return x.id===BOT.ctx;});
  if(!c){BOT.pending={kind:"uploadCompany"};botSay("Which client should I file <strong>"+esc(BOT.file?BOT.file.name:"the file")+"</strong> under?");return;}
  var types=["NDA","MSA","Insurance / COI","Subcontract","Service Agreement","Permit","W-9 / Tax","Other"];
  botSay('Where should <strong>'+esc(BOT.file.name)+'</strong> go for <strong>'+esc(c.name)+'</strong>? Pick the destination and I will re-confirm before saving.'+
    '<div class="chips">'+types.map(function(t){return '<span class="chip go" onclick="botPickType(\''+encodeURIComponent(t)+'\')">'+t+'</span>';}).join("")+
    '<span class="chip warn" onclick="botCancelUpload()">Cancel</span></div>');
}
function botCancelUpload(){BOT.file=null;BOT.pending=null;botSay("Cancelled the upload.");}
async function botDoUpload(typeEnc){
  var type=decodeURIComponent(typeEnc);
  var c=DB.companies.find(function(x){return x.id===BOT.ctx;});
  var file=BOT.file;
  if(!c||!file){botSay("Something went wrong, please attach the file again.");return;}
  if(!DOCLIB){botSay("The documents library isn't connected, so I can't upload right now.");return;}
  botSay('Uploading <strong>'+esc(file.name)+'</strong> to '+esc(c.name)+'...');
  try{
    var t=await tok();
    var safe=(c.name+"_"+type+"_"+Date.now()+"_"+file.name).replace(/[^A-Za-z0-9._-]/g,"_");
    var up=await fetch("https://graph.microsoft.com/v1.0/sites/"+SITE+"/lists/"+DOCLIB+"/drive/root:/"+encodeURIComponent(safe)+":/content",{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":file.type||"application/octet-stream"},body:file});
    var drv=await up.json();if(drv.error)throw new Error(drv.error.message);
    var li=await graph("/sites/"+SITE+"/drives/"+drv.parentReference.driveId+"/items/"+drv.id+"/listItem?$select=id");
    await graph("/sites/"+SITE+"/lists/"+DOCLIB+"/items/"+li.id+"/fields",{method:"PATCH",body:JSON.stringify({DocType:type,Status:"Pending",Company:c.name})});
    c.docs=c.docs||[];var _ud={spId:li.id,id:li.id,type:type,status:"Pending",date:"",link:drv.webUrl};c.docs.push(_ud);
    if(typeof auditLog==="function")auditLog({entity:"Documents",recordId:li.id,recordName:type,company:c.name,action:"Upload",summary:"Uploaded "+type+" via assistant",snapshot:(typeof docSnap==="function")?docSnap(_ud):_ud});
    BOT.file=null;
    if(sel===c.id)detailView();
    botSay('Done. <strong>'+esc(type)+'</strong> is filed under '+botLink(c,c.name,"documents")+' as Pending. <a href="'+esc(drv.webUrl)+'" target="_blank" rel="noopener">Open the file</a>.');
  }catch(e){botSay("Upload failed: "+esc(e.message||String(e)));}
}

/* ---- context + chat plumbing ---- */
function botCtxSet(id){BOT.ctx=id;}
function botGo(id,tab){
  pick(id);
  if(tab&&tab!=="overview")setTab(tab);
  BOT.ctx=id;
  if(BOT.full)botFull();
}
function botAsk(text){document.getElementById("botInput").value=text;botSend();}

function botSay(html,cls){
  var wrap=document.getElementById("botMsgs");
  var row=document.createElement("div");
  row.className="bmrow"+(cls==="me"?" me":"");
  row.innerHTML='<div class="bubble '+(cls==="me"?"me":"bot")+'">'+html+'</div>';
  wrap.appendChild(row);
  wrap.scrollTop=wrap.scrollHeight;
}
async function botSend(){
  var el=document.getElementById("botInput");
  var text=(el.value||"").trim();
  if(!text)return;
  el.value="";el.style.height="auto";
  var _m=document.getElementById("botMsgs");if(_m)_m.innerHTML=""; /* refresh: one clean answer per question */
  botSay(esc(text),"me");
  if(BOT.pending&&BOT.pending.kind==="uploadCompany"){
    var c=botMatchOneCompany(text);
    if(c){BOT.ctx=c.id;BOT.pending=null;botProposeUpload();}
    else botSay("I couldn't find a client called \""+esc(text)+"\". Try the exact name.");
    return;
  }
  var res=await botInterpret(text);
  botRender(res);
}
function botKey(e){
  var el=e.target;el.style.height="auto";el.style.height=Math.min(el.scrollHeight,96)+"px";
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();botSend();}
}
function botToggle(){
  BOT.open=!BOT.open;
  document.getElementById("botPanel").classList.toggle("open",BOT.open);
  document.getElementById("botFab").style.display=BOT.open?"none":"flex";
  if(BOT.open){
    if(!BOT.greeted){BOT.greeted=true;botSay("Hi, I'm your CRM assistant. Ask me to find companies, contacts, or documents, upload a file to a client, or update a record. What do you need?");botSuggest();}
    setTimeout(function(){var i=document.getElementById("botInput");if(i)i.focus();},50);
  }
}
function botFull(){
  BOT.full=!BOT.full;
  document.getElementById("botPanel").classList.toggle("full",BOT.full);
  document.getElementById("botFullBtn").innerHTML=BOT.full?"&#8863;":"&#11036;";
}
function botSuggest(){
  var s=document.getElementById("botSugg");
  var ideas=["Tier A companies","No signed NDA","Developers in Texas","Stale 60+ days"];
  s.innerHTML=ideas.map(function(x){return '<span class="chip" onclick="botAsk(\''+x.replace(/'/g,"")+'\')">'+x+'</span>';}).join("");
}

</script>
